<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  // Counts React commits, as the devtools hook sees them, before React loads.
  window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = { supportsFiber: true, isDisabled: false, renderers: new Map(),
    inject: () => 1, checkDCE() {}, onCommitFiberUnmount() {}, onPostCommitFiberRoot() {},
    onCommitFiberRoot() { const c = (globalThis.__historyCounters ??= { rows: 0, markdown: 0, conversions: 0 }); c.commits = (c.commits ?? 0) + 1; } };
</script></head>
<body><div id="root"></div><script type="module" src="/scripts/chat-history/browser.tsx"></script></body></html>
