<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>CLIde</title>

    <!-- Fonts: Encode Sans (UI) + Merriweather (chat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CLIde" />
    
    <!-- iOS Safari Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />
    
    <!-- Theme Color (static fallback for standalone PWA / pre-hydration;
         ThemeContext updates this at runtime per light/dark theme) -->
    <meta name="theme-color" content="#141414" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    
    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Apply the saved/system theme before first paint so the auth loading
         screen and PWA status bar don't flash the light theme before React
         hydrates. Mirrors the logic in ThemeContext (kept in sync there). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved === 'dark' || saved === 'light'
            ? saved === 'dark'
            : Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute('content', isDark ? '#141414' : '#f6f4ef');
          }
          var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (statusBar) {
            statusBar.setAttribute('content', isDark ? 'black-translucent' : 'default');
          }
        } catch (e) {
          /* localStorage/matchMedia unavailable — fall back to static meta defaults */
        }
      })();
    </script>
    <!-- Tag Samsung Internet on the root element before first paint. On a phone
         it misreports itself as a hover/fine-pointer device, so the
         `@media (hover: none) and (pointer: coarse)` rules that force-reveal
         hover-only controls (tool-call copy button, sidebar row actions, …)
         never match it. Those controls then stay `opacity-0` until a tap applies
         a sticky `:hover`. The CSS treats `.samsung-browser` like touch so they
         start visible. -->
    <script>
      (function () {
        try {
          if (/SamsungBrowser/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('samsung-browser');
          }
        } catch (e) {
          /* navigator unavailable — skip the opt-out, no correctness impact elsewhere */
        }
      })();
    </script>
    <!-- Block native pinch-to-zoom of the page. The viewport meta already sets
         user-scalable=no, but Samsung Internet and iOS Safari deliberately
         ignore that for accessibility, so pinch-zoom leaks through there (not in
         Chrome/Firefox, which honor the meta tag). Suppressing the browser
         default on multi-touch gestures stops the page from zooming while
         leaving the app's own touch JS untouched — the terminal reads raw touch
         positions for its font-size pinch, so its handler still fires. Single
         touches are never intercepted, so scrolling is unaffected. -->
    <script>
      (function () {
        var opts = { passive: false };
        document.addEventListener('touchmove', function (e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, opts);
        // WebKit gesture events (iOS Safari) — harmless no-ops elsewhere.
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
          document.addEventListener(name, function (e) { e.preventDefault(); }, opts);
        });
        // Ctrl+wheel zoom (desktop / hardware keyboards paired with the PWA).
        document.addEventListener('wheel', function (e) {
          if (e.ctrlKey) { e.preventDefault(); }
        }, opts);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
